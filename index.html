<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розрахунок заряду батареї</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Розрахунок заряду батареї</h1>
        <form id="calculator-form">
            <label for="battery-type">Тип батареї:</label>
            <select id="battery-type">
                <option value="gel">GEL</option>
                <option value="agm">AGM/WET</option>
                <option value="lipo">Li-Po/Ion</option>
                <option value="life">LiFePO4</option>
            </select>
            <label for="voltage">Напруга (В):</label>
            <input type="number" id="voltage" required>
            <label for="charge">Заряд (%) :</label>
            <input type="number" id="charge" required>
            <button type="submit">Розрахувати</button>
        </form>
        <div id="result"></div>
        <div class="battery-indicator">
            <div class="battery-level" id="battery-level"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
